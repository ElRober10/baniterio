services:
  postgres:
    image: postgres:17-alpine
    container_name: baniterio-postgres
    environment:
      POSTGRES_DB: baniterio
      POSTGRES_USER: baniterio
      POSTGRES_PASSWORD: baniterio-local
    ports:
      - "5432:5432"
    volumes:
      - baniterio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baniterio -d baniterio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  baniterio-postgres-data:
