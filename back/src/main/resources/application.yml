spring:
  application:
    name: baniterio-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/baniterio}
    username: ${DATABASE_USERNAME:baniterio}
    password: ${DATABASE_PASSWORD:baniterio-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}