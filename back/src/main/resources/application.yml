# Configuración de la aplicación. Sintaxis ${VARIABLE:valor-por-defecto}:
# usa la variable de entorno si existe, si no el valor tras los dos puntos
# (el de por defecto sirve para desarrollo local).

spring:
  application:
    name: baniterio-api
  datasource:                       # conexión a Postgres
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/baniterio}
    username: ${DATABASE_USERNAME:baniterio}
    password: ${DATABASE_PASSWORD:baniterio-local}
  jpa:
    open-in-view: false             # buena práctica: no dejar la sesión de BBDD abierta durante el render
    hibernate:
      ddl-auto: validate            # Hibernate NO crea/altera tablas; solo comprueba que las entidades cuadran con el esquema que hizo Flyway
  flyway:
    enabled: true                   # aplica las migraciones db/migration/V*.sql al arrancar
  servlet:
    multipart:                      # límites de subida de ficheros (fotos de perfil)
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}

# Config propia (la lee AppProperties.java)
app:
  jwt:
    # Clave para firmar los JWT. El valor por defecto es SOLO para local: al
    # estar en el repo no es secreto, y JwtService se niega a arrancar con él
    # fuera de los perfiles dev/test/default. En producción: pasar JWT_SECRET.
    secret: ${JWT_SECRET:ZGV2LW9ubHktYmFuaXRlcmlvLXNlY3JldC1jaGFuZ2UtaW4tcHJvZC0xMjM0NQ==}
    expiracion-dias: 7
  identidad:
    telefono-fundador: ${TELEFONO_FUNDADOR}   # obligatorio (sin valor por defecto): este teléfono entra como superadmin al registrarse
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}   # desde qué origen (el front) acepta peticiones el navegador
  email:
    # "smtp" = envía de verdad (requiere spring.mail.* configurado) · "log" = solo log
    modo: ${MAIL_MODO:log}
    from: ${MAIL_FROM:Bañiterio <no-reply@baniterio.local>}
    enlace-registro: ${MAIL_ENLACE_REGISTRO:http://localhost:4200/registro}
  push:
    modo: ${PUSH_MODO:log}                    # log = solo traza · fcm = envía por Firebase
    credenciales-json: ${PUSH_CREDENCIALES:}  # ruta al service-account.json (solo modo fcm)
  media:
    dir: ${MEDIA_DIR:./media-baniterio}       # carpeta de fotos de perfil subidas (volumen persistente en prod)

# Documentación de la API (springdoc / Swagger UI).
# - La UI se sirve en /api  (sin enlace en la web: se entra tecleando la URL).
# - En producción: SWAGGER_ENABLED=false para no exponerla.
springdoc:
  swagger-ui:
    path: /api
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /api/api-docs
    enabled: ${SWAGGER_ENABLED:true}