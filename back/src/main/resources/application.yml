spring:
  application:
    name: baniterio-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/baniterio}
    username: ${DATABASE_USERNAME:baniterio}
    password: ${DATABASE_PASSWORD:baniterio-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktYmFuaXRlcmlvLXNlY3JldC1jaGFuZ2UtaW4tcHJvZC0xMjM0NQ==}
    expiracion-dias: 7
  identidad:
    telefono-fundador: ${TELEFONO_FUNDADOR:600000001}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}