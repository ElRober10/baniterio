#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
# file.encoding=windows-1252 (no UTF-8) a propósito: la ruta del repo lleva
# "ñ" (Bañiterio). El daemon escribe el argfile de classpath del worker de
# test (~/.gradle/.tmp/gradle-worker-classpath*txt) con su file.encoding, pero
# el lanzador del worker expande @argfile decodificándolo con sun.jnu.encoding
# (derivado del locale del SO = windows-1252, no ajustable por -D). Si el
# daemon lo escribe en UTF-8 ("ñ" -> 0xC3 0xB1) el worker lo lee como "Ã±", la
# ruta del proyecto en el classpath deja de existir y :shared:testAndroidHostTest
# revienta con ClassNotFoundException. Forzando la escritura a windows-1252
# ("ñ" -> 0xF1, un byte) coincide con la lectura del worker.
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=windows-1252
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# El repo vive en una ruta con "ñ" (Bañiterio); el proyecto es Kotlin/Compose puro
# sin código nativo (NDK/CMake), así que esta comprobación de ruta ASCII no aplica aquí.
android.overridePathCheck=true
