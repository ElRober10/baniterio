<section class="mx-auto w-full text-center">
  <div class="mb-4 text-left">
    <app-volver [destino]="'/panel/precio-bebidas/' + anio" etiqueta="Precio bebidas" />
  </div>

  <h1 class="font-display text-2xl font-extrabold leading-tight">Precio de las bebidas</h1>
  <p class="mt-2 text-sm text-muted">Elige una categoría.</p>

  <ul class="mx-auto mt-6 flex max-w-186 flex-wrap justify-center gap-3">
    @for (c of categorias; track c.etiqueta) {
      <li>
        <a
          [routerLink]="c.ruta"
          class="carta-relieve flex h-20 w-60 items-center justify-center rounded-2xl px-4 text-center font-display text-lg font-bold transition hover:brightness-110"
        >
          {{ c.etiqueta }}
        </a>
      </li>
    }
  </ul>
</section>
