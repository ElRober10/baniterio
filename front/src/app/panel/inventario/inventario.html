<section class="mx-auto w-full text-center">
  <h1 class="font-display text-2xl font-extrabold leading-tight">Inventario</h1>
  <p class="mt-2 text-sm text-muted">Lo que la peña tiene almacenado. Elige una categoría.</p>

  <ul class="mx-auto mt-6 flex max-w-150 flex-wrap justify-center gap-3">
    @for (c of categorias; track c.slug) {
      <li>
        <a
          [routerLink]="['/panel/inventario', c.slug]"
          class="carta-relieve flex h-20 w-48 items-center justify-center rounded-2xl px-4 text-center font-display text-lg font-bold transition hover:brightness-110"
        >
          {{ c.etiqueta }}
        </a>
      </li>
    }
  </ul>
</section>
