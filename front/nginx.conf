server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12M;

    ssl_certificate /etc/letsencrypt/live/xn--baiterio-e3a.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--baiterio-e3a.es/privkey.pem;

    # nginx no trae ".mjs" en su tabla de tipos por defecto y lo sirve como
    # application/octet-stream: el navegador rechaza importarlo como módulo JS
    # (lo necesita el worker de pdfjs-dist, pdf.worker.min.mjs).
    location ~ \.mjs$ {
        default_type application/javascript;
        # Se pide con `?v=<versión de pdfjs-dist>` (ver cuenta-detalle.ts), así que cachear
        # fuerte es seguro: si el contenido cambia, cambia la URL.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
